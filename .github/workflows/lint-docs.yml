name: lint-docs
on:
  pull_request:
  push:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash plugins/kit/scripts/lint-skill-docs.sh

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hook suites gate code Claude Code runs on every tool call, so a break here
      # is a break in every session. replay-transcripts.sh finds no transcripts on a
      # runner and exits clean; it is the local pass that has real payloads to replay.
      - run: bash plugins/kit/hooks/tests/run-all.sh

  unslop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report-only: no --strict, so it exits 0 and the hit count is visible in the
      # job log without blocking. Flip to --strict once the standing hits are cleared.
      - run: bash plugins/kit/scripts/unslop-check.sh
