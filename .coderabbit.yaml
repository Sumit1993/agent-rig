# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# This repo has no Claude review lane (#88), so CodeRabbit reviews every non-draft PR.
# One review per PR, then batch fixes and re-request by hand. Procedure: skills/coderabbit-lane.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
      - "chore(master): release"
  path_instructions:
    - path: "plugins/rig/hooks/*.sh"
      instructions: >-
        Claude Code hooks. stdin is JSON, stdout is a protocol channel. A hook must exit 0 or 2
        on any input, including junk and an empty object; never a stack trace. Exit 2 blocks with
        the stderr text as the reason. Flag any path where malformed input, a missing binary
        (jq, gh, mage) or a network failure could change the exit code or print non-JSON on stdout.
    - path: "plugins/rig/hooks/tests/*.sh"
      instructions: >-
        Offline regression suites. Flag any test that reaches the network or the real state
        directories, any assertion that cannot fail, and any fixture that duplicates the hook's
        own logic instead of exercising it.
    - path: "plugins/rig/skills/**/*.md"
      instructions: >-
        Agent-facing procedure text. Flag a step an agent cannot execute as written, a command
        whose flags do not exist, and a claim about an external tool with no source named.
    - path: "plugins/rig/skills/**/*.sh"
      instructions: >-
        Watcher and delegation scripts run unattended. Flag a computed value the script uses but
        never prints, a gate whose third outcome (could not determine) folds to permissive, and
        any sleep or poll with no deadline.
